<!DOCTYPE html>
<html>
<head>
    <title>Klim — Чаты</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c0e;
            display: flex;
            justify-content: center;
        }
        .chats-container {
            width: 100%;
            max-width: 600px;
            background: #0f1214;
            min-height: 100vh;
            border-left: 1px solid #1e2428;
            border-right: 1px solid #1e2428;
        }
        .header {
            padding: 16px;
            background: #1e2428;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border-bottom: 1px solid #2b3338;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        .new-chat-btn {
            background: #50a2e9;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chats-list {
            padding: 0;
        }
        .chat-item {
            display: flex;
            padding: 16px;
            border-bottom: 1px solid #1e2428;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover {
            background: #1e2428;
        }
        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #2b3338;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .chat-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .chat-name {
            color: white;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .last-message {
            color: #8e9aa3;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
        }
        .time {
            color: #6e7a84;
            font-size: 13px;
        }
        .logout {
            color: #e95a5a;
            margin-left: 16px;
            cursor: pointer;
            font-size: 20px;
        }
        .user-email {
            color: #8e9aa3;
            font-size: 14px;
            margin-right: 12px;
        }
    </style>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { 
            ref, onValue, set, push, serverTimestamp, get 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let currentUser = null;
        let allUsers = {};

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('user-email').textContent = user.email;
                loadChats(user.uid);
                loadAllUsers();
                setupOnlineStatus(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        window.logout = async () => {
            if (currentUser) {
                await set(ref(db, `users/${currentUser.uid}/online`), false);
                await set(ref(db, `users/${currentUser.uid}/lastSeen`), serverTimestamp());
            }
            await signOut(auth);
            window.location.href = 'index.html';
        };

        function loadAllUsers() {
            const usersRef = ref(db, 'users');
            onValue(usersRef, (snapshot) => {
                allUsers = {};
                snapshot.forEach((childSnapshot) => {
                    allUsers[childSnapshot.key] = childSnapshot.val();
                });
            });
        }

        function loadChats(myUid) {
            const chatsRef = ref(db, 'chats');
            onValue(chatsRef, (snapshot) => {
                const container = document.getElementById('chats-list');
                container.innerHTML = '';
                
                const chats = [];
                snapshot.forEach((chatSnapshot) => {
                    const chat = chatSnapshot.val();
                    if (chat.users && chat.users[myUid]) {
                        const otherUid = Object.keys(chat.users).find(uid => uid !== myUid);
                        if (otherUid) {
                            chats.push({
                                id: chatSnapshot.key,
                                ...chat,
                                otherUid
                            });
                        }
                    }
                });
                
                chats.sort((a, b) => {
                    const timeA = a.lastMessage?.timestamp || 0;
                    const timeB = b.lastMessage?.timestamp || 0;
                    return timeB - timeA;
                });
                
                if (chats.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                } else {
                    document.getElementById('empty-state').style.display = 'none';
                    chats.forEach(chat => renderChat(chat));
                }
            });
        }

        function renderChat(chat) {
            const otherUser = allUsers[chat.otherUid];
            if (!otherUser) return;
            
            const container = document.getElementById('chats-list');
            const chatElement = document.createElement('div');
            chatElement.className = 'chat-item';
            chatElement.onclick = () => window.location.href = `chat.html?chatId=${chat.id}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = otherUser.name ? otherUser.name[0].toUpperCase() : '?';
            
            const chatInfo = document.createElement('div');
            chatInfo.className = 'chat-info';
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'chat-name';
            nameDiv.textContent = otherUser.name || otherUser.email;
            
            const lastMsgDiv = document.createElement('div');
            lastMsgDiv.className = 'last-message';
            
            const lastMsgText = document.createElement('span');
            if (chat.lastMessage) {
                const sender = chat.lastMessage.senderId === currentUser.uid ? 'Вы: ' : '';
                lastMsgText.textContent = sender + (chat.lastMessage.text || '');
            } else {
                lastMsgText.textContent = 'Нет сообщений';
            }
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            if (chat.lastMessage?.timestamp) {
                const date = new Date(chat.lastMessage.timestamp);
                timeSpan.textContent = formatTime(date);
            }
            
            lastMsgDiv.appendChild(lastMsgText);
            lastMsgDiv.appendChild(timeSpan);
            
            chatInfo.appendChild(nameDiv);
            chatInfo.appendChild(lastMsgDiv);
            
            chatElement.appendChild(avatar);
            chatElement.appendChild(chatInfo);
            
            container.appendChild(chatElement);
        }

        function formatTime(date) {
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        function setupOnlineStatus(uid) {
            const statusRef = ref(db, `users/${uid}/online`);
            const lastSeenRef = ref(db, `users/${uid}/lastSeen`);
            
            set(statusRef, true);
            set(lastSeenRef, serverTimestamp());
            
            window.addEventListener('beforeunload', () => {
                set(statusRef, false);
                set(lastSeenRef, serverTimestamp());
            });
        }

        window.createNewChat = async () => {
            const email = prompt('Введите email собеседника:');
            if (!email) return;
            
            const usersRef = ref(db, 'users');
            const snapshot = await get(usersRef);
            
            let otherUser = null;
            snapshot.forEach((childSnapshot) => {
                const user = childSnapshot.val();
                if (user.email === email) {
                    otherUser = { uid: childSnapshot.key, ...user };
                }
            });
            
            if (!otherUser) {
                alert('Пользователь не найден');
                return;
            }
            
            if (otherUser.uid === currentUser.uid) {
                alert('Нельзя создать чат с самим собой');
                return;
            }
            
            const chatsRef = ref(db, 'chats');
            const chatsSnapshot = await get(chatsRef);
            let existingChat = null;
            
            chatsSnapshot.forEach((chatSnapshot) => {
                const chat = chatSnapshot.val();
                if (chat.users && 
                    chat.users[currentUser.uid] && 
                    chat.users[otherUser.uid]) {
                    existingChat = chatSnapshot.key;
                }
            });
            
            if (existingChat) {
                window.location.href = `chat.html?chatId=${existingChat}`;
                return;
            }
            
            const newChatRef = push(ref(db, 'chats'));
            await set(newChatRef, {
                users: {
                    [currentUser.uid]: true,
                    [otherUser.uid]: true
                },
                createdAt: serverTimestamp(),
                lastMessage: null
            });
            
            window.location.href = `chat.html?chatId=${newChatRef.key}`;
        };
    </script>
</head>
<body>
    <div class="chats-container">
        <div class="header">
            <h1>Klim</h1>
            <div style="display: flex; align-items: center;">
                <span id="user-email" class="user-email"></span>
                <button class="new-chat-btn" onclick="createNewChat()">+</button>
                <span class="logout" onclick="logout()">⏻</span>
            </div>
        </div>
        
        <div id="chats-list" class="chats-list"></div>
        
        <div id="empty-state" style="padding: 30px; text-align: center; color: #6e7a84; display: none;">
            Нет чатов<br>
            <small style="color: #8e9aa3;">Нажми + чтобы начать</small>
        </div>
    </div>
</body>
</html>
