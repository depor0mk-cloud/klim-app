<!DOCTYPE html>
<html>
<head>
    <title>Klim Messenger</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c0e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-form {
            background: #1e2428;
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { 
            color: #fff; 
            margin-bottom: 24px; 
            font-weight: 500;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: #2b3338;
            border: 1px solid #3a444b;
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }
        input::placeholder { color: #8e9aa3; }
        button {
            width: 100%;
            padding: 14px;
            background: #50a2e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
        }
        button:hover { background: #3f8ed9; }
        .switch {
            color: #8e9aa3;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .switch a { color: #50a2e9; text-decoration: none; cursor: pointer; }
    </style>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        window.register = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            
            if (!email || !password || !name) {
                alert('Заполни все поля');
                return;
            }
            
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                
                await set(ref(db, 'users/' + cred.user.uid), {
                    uid: cred.user.uid,
                    email: email,
                    name: name,
                    online: true,
                    lastSeen: serverTimestamp(),
                    createdAt: serverTimestamp()
                });
                
                window.location.href = 'chats.html';
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        };
        
        window.login = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'chats.html';
            } catch (e) {
                alert('Неверный email или пароль');
            }
        };
        
        window.showLogin = () => {
            document.getElementById('name-field').style.display = 'none';
            document.querySelector('h2').textContent = 'Вход в Klim';
            document.querySelector('button[onclick="register()"]').style.display = 'none';
            document.querySelector('button[onclick="login()"]').style.display = 'block';
            document.querySelector('.switch').innerHTML = 'Нет аккаунта? <a onclick="showRegister()">Создать</a>';
        };
        
        window.showRegister = () => {
            document.getElementById('name-field').style.display = 'block';
            document.querySelector('h2').textContent = 'Регистрация в Klim';
            document.querySelector('button[onclick="register()"]').style.display = 'block';
            document.querySelector('button[onclick="login()"]').style.display = 'none';
            document.querySelector('.switch').innerHTML = 'Уже есть аккаунт? <a onclick="showLogin()">Войти</a>';
        };
        
        window.onload = showLogin;
    </script>
</head>
<body>
    <div class="auth-form">
        <h2>Klim Messenger</h2>
        <input type="text" id="name" placeholder="Имя" style="display: none;">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        
        <button onclick="register()" style="display: none;">Зарегистрироваться</button>
        <button onclick="login()">Войти</button>
        
        <div class="switch">
            <a onclick="showRegister()">Создать аккаунт</a>
        </div>
    </div>
</body>
</html>
